[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gnssguard"
version = "0.1.0"
description = "Detect GNSS jamming and spoofing affecting aircraft from open ADS-B data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pyarrow>=15",
    "pandas>=2.1",
    "pyyaml>=6",
    "requests>=2.31",
]

[project.optional-dependencies]
fast = ["orjson>=3.9"]
dev = ["pytest>=8", "ruff>=0.5", "pre-commit>=3"]

[project.scripts]
gnssguard = "gnssguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
