[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gnssguard"
version = "0.1.0"
description = "Detect GNSS jamming and spoofing affecting aircraft from open ADS-B data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pyarrow>=15",
    "pandas>=2.1",
    "pyyaml>=6",
    "requests>=2.31",
]

[project.optional-dependencies]
fast = ["orjson>=3.9"]
dev = ["pytest>=8", "ruff>=0.5", "pre-commit>=3"]

[project.scripts]
gnssguard = "gnssguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gnssguard = ["viz/data/*.json.gz"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# GridSpec is a frozen dataclass: safe as a default argument
extend-immutable-calls = ["gnssguard.features.cells.GridSpec", "GridSpec"]

[tool.ruff.lint.per-file-ignores]
# the embedded HTML/JS page template is not Python
"src/gnssguard/viz/map.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
