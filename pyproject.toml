[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "gnssguard"
version = "0.2.1.dev0"
description = "Detect GNSS jamming and spoofing affecting aircraft from open ADS-B data"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "pyarrow>=15",
    "pandas>=2.1",
    "pyyaml>=6",
    "requests>=2.31",
    "lightgbm>=4",
]

[project.optional-dependencies]
fast = ["orjson>=3.9"]
ground = ["hatanaka>=2.8.1"]  # EUREF station files (gnssguard ground-check)
opensky = ["pyopensky>=2.18"]  # second receiver network (gnssguard opensky-check)
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10", "pre-commit>=3"]

[project.scripts]
gnssguard = "gnssguard.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gnssguard = ["viz/data/*.json.gz", "product/site/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# GridSpec is a frozen dataclass: safe as a default argument
extend-immutable-calls = ["gnssguard.features.cells.GridSpec", "GridSpec"]

[tool.ruff.lint.per-file-ignores]
# the embedded HTML/JS page template is not Python
"src/gnssguard/viz/map.py" = ["E501"]
"src/gnssguard/labels/goldtool.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]
# With PYTHONWARNDEFAULTENCODING=1 (set in CI), any text file opened without an explicit
# encoding fails the tests: Windows defaults to cp1252, Linux to UTF-8.
filterwarnings = [
    "error::EncodingWarning",
    # LightGBM's own save_model writes ASCII without naming an encoding: harmless
    "ignore::EncodingWarning:lightgbm",
]

[tool.mypy]
# pandas ships without type information (pandas-stubs types every cell as a 15-way union
# and buries real errors), so pandas objects are unchecked; everything else is checked.
files = ["src"]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true  # bodies of unannotated functions too
warn_unused_ignores = true
warn_redundant_casts = true

[tool.coverage.run]
source = ["gnssguard"]
omit = ["*/gnssguard/cli/__main__.py"]

[tool.coverage.report]
# measured 74% on 8 Nov 2026; the floor stops it from falling unnoticed
fail_under = 72
skip_covered = true
show_missing = true
