name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Windows too: the project is developed on Windows, where text files default to cp1252
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONWARNDEFAULTENCODING: "1"  # text files opened without an encoding fail the tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,fast]" -c constraints.txt
      - run: ruff check .
      - run: python -m pytest -q

  secrets-scan:
    # Scans the whole history on every push. (The gitleaks GitHub Action scans only the
    # pushed range, which breaks when history is rewritten and the old commit is gone.)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks 8.21.2 (checksum-verified)
        run: |
          curl -sSL -o gitleaks.tgz https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  gitleaks.tgz" | sha256sum -c -
          tar -xzf gitleaks.tgz gitleaks
      - name: Scan the full history for secrets
        run: ./gitleaks git --redact --verbose .
