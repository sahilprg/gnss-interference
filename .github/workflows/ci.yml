name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Windows too: the project is developed on Windows, where text files default to cp1252
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      PYTHONWARNDEFAULTENCODING: "1"  # text files opened without an encoding fail the tests
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,fast]" -c constraints.txt
      - run: ruff check .
      - run: python -m mypy
      - run: python -m pytest -q --cov

  secrets-scan:
    # Scans the whole history on every push. (The gitleaks GitHub Action scans only the
    # pushed range, which breaks when history is rewritten and the old commit is gone.)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          cache: false
      - name: Install gitleaks 8.21.2 (verified)
        # The release file, checked against its SHA-256. GitHub's release downloads failed
        # for long stretches on 8 and 9 Nov 2026 (HTTP 504, five retries in a row), so if
        # they fail, the same version is built from the Go module mirror instead, which Go
        # checks against its public checksum database (sum.golang.org).
        run: |
          url=https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz
          if curl -sSL --fail --retry 2 --retry-all-errors --retry-delay 5 -o gitleaks.tgz "$url" \
             && echo "5bc41815076e6ed6ef8fbecc9d9b75bcae31f39029ceb55da08086315316e3ba  gitleaks.tgz" | sha256sum -c -; then
            tar -xzf gitleaks.tgz gitleaks
          else
            echo "::warning::release download failed; building gitleaks 8.21.2 from the Go module mirror"
            GOBIN="$PWD" go install github.com/zricethezav/gitleaks/v8@v8.21.2
          fi
          ./gitleaks version
      - name: Scan the full history for secrets
        run: ./gitleaks git --redact --verbose .
